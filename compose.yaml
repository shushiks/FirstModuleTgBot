services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zero_semester
      POSTGRES_USER: zero_semester
      POSTGRES_PASSWORD: zero_semester
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_semester -d zero_semester"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    command: uvicorn zero_semester.admin.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data/media

  bot:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    command: python -m zero_semester.bot.main
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data/media

  worker:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    command: python -m zero_semester.worker.main
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data/media

volumes:
  postgres_data:
  media_data:
