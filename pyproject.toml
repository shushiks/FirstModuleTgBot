[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zero-semester"
version = "0.1.0"
description = "Telegram bot and admin panel for the Zero Semester course"
readme = "Readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.17,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
zero-semester-bot = "zero_semester.bot.main:main"
zero-semester-worker = "zero_semester.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_semester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["zero_semester"]
